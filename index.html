<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe BOM &amp; Live Stock</title>
<style>
:root{--bg:#F2F2F2;--lime:#A9EB4E;--pink:#F2A19B;--teal:#6FCBD9;--cream:#E9E2CF;--ink:#111;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:104px}
header,main,#al{max-width:560px;margin:0 auto}
header{position:relative;padding:18px 16px 4px;overflow:hidden}
header>*{position:relative;z-index:1}
.sw{position:absolute;right:-30px;top:0;width:340px;z-index:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:14px}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--ink)}
.hero{background:var(--lime);border-radius:32px;padding:18px}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:104px;margin-bottom:12px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar{width:22px;background:#fff;border-radius:99px}
.bar.lo{background:var(--ink)}
.col small{font-size:11px;font-weight:600;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:8px 16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:18px 0 16px}
h2{font-size:clamp(36px,11vw,50px);font-weight:800;letter-spacing:-.045em;line-height:.95;margin:0}
h2 span{display:block;padding-left:20%}
h3{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.card{position:relative;background:#fff;border-radius:30px;padding:18px 18px 32px;margin:0 0 -18px}
.card:last-child{margin-bottom:12px;padding-bottom:18px}
.c0{background:var(--lime)}
.c1{background:var(--cream)}
.c2,.card.ok{background:var(--teal)}
.c3,.card.low{background:var(--pink)}
.card.out{background:var(--ink);color:#fff}
.card.w{background:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{font-size:13px;opacity:.65}
.qty{font-size:30px;font-weight:800;letter-spacing:-.03em}
.tag{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:#fff;color:var(--ink)}
.tag.blk{background:var(--ink);color:#fff}
.card.out .tag{background:var(--pink)}
.alert{background:var(--pink);border-radius:24px;padding:12px 16px;margin:8px 16px;font-weight:600;font-size:14px}
button{font:inherit;font-weight:600;border:0;background:#fff;color:var(--ink);border-radius:99px;padding:10px 18px;min-height:44px;cursor:pointer}
button:active{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.pri{background:var(--ink);color:#fff}
button.ghost{background:transparent;border:1.5px solid currentColor}
.pill{min-height:38px;padding:6px 16px;box-shadow:0 0 0 1.5px #e0e0e0}
.card.out button.pri{background:var(--lime);color:var(--ink)}
.card.out button.ghost{color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input,select{width:100%;font:inherit;padding:10px 14px;border:0;border-radius:16px;background:#fff;color:var(--ink);min-height:46px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;opacity:.8}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ing{align-items:center;margin-top:8px}
.ing select{flex:2}
.ing .x{flex:0 0 44px;width:44px;padding:0;background:var(--ink);color:#fff;border-radius:50%}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:flex;gap:4px;background:var(--ink);border-radius:99px;padding:6px;z-index:4}
nav button{flex:1;background:none;color:#fff;padding:10px 0;font-size:14px}
nav button.on{background:var(--lime);color:var(--ink)}
#m{display:none;position:fixed;inset:0;background:rgba(17,17,17,.5);z-index:5;align-items:flex-end;justify-content:center}
#m.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:32px 32px 0 0;padding:20px 18px 26px}
#t{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:9;max-width:90%}
.lg{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(127,127,127,.28);font-size:14px}
.lg:last-child{border-bottom:0}
.neg{font-weight:800;color:var(--bad)}
.pos{font-weight:800;color:#2f6b1f}
</style>
</head>
<body>
<header><svg class="sw" viewBox="0 0 400 220" aria-hidden="true"><path d="M-10 170C80 40 170 210 260 100S380 70 420 20" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/></svg><div class="brand"><i></i>Recipe BOM and live stock</div><div id="k"></div></header>
<div id="al"></div>
<main id="v"></main>
<nav>
<button data-t="stock">Stock</button>
<button data-t="recipes">Recipes</button>
<button data-t="sales">Sales</button>
<button data-t="log">Movements</button>
</nav>
<div id="m"></div>
<div id="t"></div>
<script>
/* Storage: swap load()/save() for IndexedDB in the main app. Everything else works on the S object. */
const K='rbos_bom_v1',$=s=>document.querySelector(s);
let S,tab='stock',D;
const r3=n=>Math.round(n*1000)/1000,f=n=>+(+n).toFixed(3),m=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=t=>new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const uid=()=>'x'+(S.n++);
const st=i=>i.qty<=0?'out':i.qty<=i.min?'low':'ok';
const item=id=>S.items.find(i=>i.id==id);
const hd=(a,b,x)=>`<div class="hd"><h2>${a}<span>${b}</span></h2>${x||''}</div>`;

function seed(){
 const t=Date.now(),it=[['Mozzarella','kg',5,450,2],['Tomatoes','kg',8,60,3],['Olive Oil','L',3,700,1],['Takeaway Box','pcs',100,8,20]]
  .map((a,k)=>({id:'i'+k,name:a[0],unit:a[1],qty:a[2],cost:a[3],min:a[4]}));
 return{n:20,items:it,sales:[],
  log:it.map(i=>({t,item:i.id,name:i.name,unit:i.unit,type:'OPENING',d:i.qty,bal:i.qty,note:'Opening stock'})),
  products:[
   {id:'p0',name:'Truffle Pizza',price:399,recipe:[{i:'i0',q:.25},{i:'i1',q:.15},{i:'i2',q:.02},{i:'i3',q:1}]},
   {id:'p1',name:'Margherita Pizza',price:299,recipe:[{i:'i0',q:.2},{i:'i1',q:.15},{i:'i2',q:.02},{i:'i3',q:1}]}]};
}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.items)S=seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function lg(it,type,d,note){S.log.unshift({t:Date.now(),item:it.id,name:it.name,unit:it.unit,type,d,bal:it.qty,note})}
function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function modal(h){$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').classList.add('on')}
function closeM(){$('#m').classList.remove('on')}

/* ---------- Views ---------- */
function render(){
 const v=S.items.reduce((a,i)=>a+i.qty*i.cost,0),al=S.items.filter(i=>st(i)!='ok');
 const mx=S.items.map(i=>Math.min(1,i.qty/Math.max(i.min*4,1e-6))),lo=mx.length?mx.indexOf(Math.min(...mx)):-1;
 $('#k').innerHTML=`<div class="hero"><div class="top"><span class="mut">Inventory value</span><span class="tag">${S.items.length} items</span></div><div class="big">${m(v)}</div><div class="bars">${S.items.map((i,k)=>`<div class="col"><div class="bar${k==lo&&al.length?' lo':''}" style="height:${Math.max(10,Math.round(mx[k]*80))}px"></div><small>${esc(i.name)}</small></div>`).join('')}</div><div class="top"><span class="mut">Taller bar means more stock left</span><span class="tag${al.length?' blk':''}">${al.length} alerts</span></div></div>`;
 $('#al').innerHTML=al.map(i=>`<div class="alert">${st(i)=='out'?'Out of stock:':'Running low:'} <b>${esc(i.name)}</b>, ${f(i.qty)} ${esc(i.unit)} left</div>`).join('');
 $('#v').innerHTML=({stock:vStock,recipes:vRec,sales:vSales,log:vLog})[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(tab=='sales')prev();
}
function vStock(){
 return hd('Kitchen','stock','<button class="pill" onclick="itemForm()">Add item</button>')+'<div class="stack">'+S.items.map(i=>`<div class="card ${st(i)}"><div class="top"><b>${esc(i.name)}</b><span class="tag ${st(i)}">${{ok:'In stock',low:'Low',out:'Out'}[st(i)]}</span></div><div class="top" style="margin-top:6px"><span class="qty">${f(i.qty)} ${esc(i.unit)}</span><span class="mut">Value ${m(i.qty*i.cost)}</span></div><div class="mut">${m(i.cost)} per ${esc(i.unit)}</div><div class="btns"><button class="pri" onclick="recvForm('${i.id}')">Receive stock</button><button class="ghost" onclick="itemForm('${i.id}')">Edit</button></div></div>`).join('')+'</div><div class="btns"><button class="ghost" onclick="resetAll()">Reset demo data</button></div>';
}
function vRec(){
 return hd('Dishes &amp;','recipes','<button class="pill" onclick="prodForm()">Add dish</button>')+'<div class="stack">'+S.products.map((p,k)=>{
  const c=p.recipe.reduce((a,r)=>a+(item(r.i)?r.q*item(r.i).cost:0),0);
  return `<div class="card c${k%4}"><div class="top"><b>${esc(p.name)}</b><b>${m(p.price)}</b></div><div class="mut" style="margin:4px 0">Ingredient cost ${m(c)}, margin ${m(p.price-c)} per dish</div>${p.recipe.map(r=>item(r.i)?`<div class="lg"><span>${esc(item(r.i).name)}</span><span>${f(r.q)} ${esc(item(r.i).unit)}</span></div>`:'').join('')||'<div class="mut">No ingredients yet. Tap Edit to add them.</div>'}<div class="btns"><button class="ghost" onclick="prodForm('${p.id}')">Edit</button></div></div>`}).join('')+'</div>';
}
function vSales(){
 if(!S.products.length)return '<div class="card">Add a dish with a recipe first, then record sales here.</div>';
 const td=new Date().toDateString(),T=S.sales.filter(s=>new Date(s.t).toDateString()==td),rev=T.reduce((a,s)=>a+s.rev,0),cg=T.reduce((a,s)=>a+s.cogs,0);
 return hd('Record','a sale')+`<div class="card c1"><label>Dish<select id="s_p" onchange="prev()">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Quantity sold<input id="s_q" type="number" min="1" step="1" value="1" oninput="prev()"></label><div id="pv" style="margin-top:8px"></div><div class="btns"><button class="pri" onclick="sell()">Record sale and deduct stock</button></div></div><div class="card c2"><h3>Today</h3><div class="lg"><span>Sales recorded</span><b>${T.length}</b></div><div class="lg"><span>Sales revenue</span><b>${m(rev)}</b></div><div class="lg"><span>Ingredients used (COGS)</span><b>${m(cg)}</b></div><div class="lg"><span>Gross profit</span><b>${m(rev-cg)}</b></div></div>`;
}
function vLog(){
 return hd('Stock','movements')+`<div class="card w"><div class="mut">Every change is recorded and cannot be edited or deleted.</div>`+(S.log.slice(0,100).map(e=>`<div class="lg"><span><b>${esc(e.name)}</b><br><span class="mut">${e.type}<br>${esc(e.note||'')}<br>${dt(e.t)}</span></span><span style="text-align:right"><span class="${e.d<0?'neg':'pos'}">${e.d>0?'+':''}${f(e.d)} ${esc(e.unit)}</span><br><span class="mut">Balance ${f(e.bal)}</span></span></div>`).join('')||'<div class="mut">No movements yet.</div>')+'</div>';
}

/* ---------- Sales: the live deduction. Call sellDish(productId, qty) from POS import or the end-of-day sheet. ---------- */
function prev(){
 const p=S.products.find(x=>x.id==$('#s_p').value),q=Math.max(0,+$('#s_q').value||0);if(!p)return;
 $('#pv').innerHTML='<div class="mut">This sale will use:</div>'+p.recipe.map(r=>{const i=item(r.i);if(!i)return'';const n=r.q*q,bad=n>i.qty+1e-9;return `<div class="lg" style="${bad?'color:var(--bad)':''}"><span>${esc(i.name)}</span><span>${f(n)} ${esc(i.unit)} (have ${f(i.qty)})</span></div>`}).join('');
}
function sellDish(pid,q){
 const p=S.products.find(x=>x.id==pid);if(!p)return null;
 let cg=0;const warn=[];
 p.recipe.forEach(r=>{
  const i=item(r.i);if(!i)return;
  const need=r.q*q,take=Math.min(need,i.qty),before=st(i),short=need>take+1e-9;
  i.qty=r3(i.qty-take);cg+=take*i.cost;
  lg(i,'RECIPE_SALE_DEDUCTION',-r3(take),q+'× '+p.name+(short?' (short by '+f(need-take)+' '+i.unit+')':''));
  if(short)warn.push(i.name+' ran out');
  else if(st(i)!=before&&st(i)!='ok')warn.push(i.name+(st(i)=='out'?' is out':' is low'));
 });
 S.sales.unshift({t:Date.now(),name:p.name,q,rev:p.price*q,cogs:cg});
 return warn;
}
function sell(){
 const q=Math.floor(+$('#s_q').value);
 if(!(q>0))return toast('Enter a quantity of 1 or more');
 const p=S.products.find(x=>x.id==$('#s_p').value),w=sellDish($('#s_p').value,q);
 save();render();
 toast(w&&w.length?'Recorded. Check stock: '+w.join(', '):q+'× '+p.name+' recorded, stock updated');
}

/* ---------- Stock item forms ---------- */
function itemForm(id){
 const i=id?item(id):{name:'',unit:'kg',qty:0,cost:0,min:0};
 modal(`<h3>${id?'Edit':'Add'} stock item</h3><label>Name<input id="f_n" value="${esc(i.name)}"></label><div class="row"><label>Unit<input id="f_u" value="${esc(i.unit)}"></label><label>Quantity in stock<input id="f_q" type="number" step="any" value="${i.qty}"></label></div><div class="row"><label>Cost per unit (₹)<input id="f_c" type="number" step="any" value="${i.cost}"></label><label>Alert when stock falls to<input id="f_m" type="number" step="any" value="${i.min}"></label></div><div class="btns"><button class="pri" onclick="saveItem('${id||''}')">Save item</button>${id?`<button class="ghost" onclick="delItem('${id}')">Delete</button>`:''}<button class="ghost" onclick="closeM()">Cancel</button></div>`);
}
function saveItem(id){
 const n=$('#f_n').value.trim(),q=Math.max(0,r3(+$('#f_q').value||0));
 if(!n)return toast('Enter an item name');
 const o={name:n,unit:$('#f_u').value.trim()||'pcs',cost:+$('#f_c').value||0,min:+$('#f_m').value||0};
 if(id){const i=item(id),d=r3(q-i.qty);Object.assign(i,o);if(d){i.qty=q;lg(i,'MANUAL_ADJUSTMENT',d,'Stock count edited')}}
 else{const i={id:uid(),qty:q,...o};S.items.push(i);lg(i,'OPENING',q,'New stock item')}
 save();closeM();render();
}
function delItem(id){
 if(S.products.some(p=>p.recipe.some(r=>r.i==id)))return toast('This item is used in a recipe. Remove it there first.');
 if(confirm('Delete this stock item? Its past movements are kept.')){S.items=S.items.filter(i=>i.id!=id);save();closeM();render()}
}
function recvForm(id){
 const i=item(id);
 modal(`<h3>Receive ${esc(i.name)}</h3><label>Quantity received (${esc(i.unit)})<input id="rc_q" type="number" step="any" min="0"></label><div class="btns"><button class="pri" onclick="doRecv('${id}')">Add to stock</button><button class="ghost" onclick="closeM()">Cancel</button></div>`);
}
function doRecv(id){
 const i=item(id),q=r3(+$('#rc_q').value);
 if(!(q>0))return toast('Enter the quantity received');
 i.qty=r3(i.qty+q);lg(i,'STOCK_IN',q,'Stock received');save();closeM();render();
}

/* ---------- Dish and recipe form ---------- */
function prodForm(id){
 const p=id?S.products.find(x=>x.id==id):{name:'',price:0,recipe:[]};
 D={id,name:p.name,price:p.price,recipe:p.recipe.map(r=>({...r}))};drawProd();
}
function drawProd(){
 modal(`<h3>${D.id?'Edit':'Add'} dish</h3><label>Dish name<input id="p_n" value="${esc(D.name)}"></label><label>Selling price (₹)<input id="p_p" type="number" step="any" value="${D.price}"></label><label>Ingredients used for 1 dish</label>${D.recipe.map((r,k)=>`<div class="row ing"><select id="r_i${k}">${S.items.map(i=>`<option value="${i.id}" ${i.id==r.i?'selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select><input id="r_q${k}" type="number" step="any" value="${r.q}" aria-label="Quantity"><button class="x" onclick="rmIng(${k})" aria-label="Remove ingredient">✕</button></div>`).join('')}<div class="btns"><button onclick="addIng()">Add ingredient</button></div><div class="btns"><button class="pri" onclick="saveProd()">Save dish</button>${D.id?'<button class="ghost" onclick="delProd()">Delete</button>':''}<button class="ghost" onclick="closeM()">Cancel</button></div>`);
}
function readProd(){D.name=$('#p_n').value;D.price=+$('#p_p').value||0;D.recipe.forEach((r,k)=>{r.i=$('#r_i'+k).value;r.q=+$('#r_q'+k).value||0})}
function addIng(){readProd();if(!S.items.length)return toast('Add a stock item first');D.recipe.push({i:S.items[0].id,q:0});drawProd()}
function rmIng(k){readProd();D.recipe.splice(k,1);drawProd()}
function saveProd(){
 readProd();const n=D.name.trim();if(!n)return toast('Enter a dish name');
 const mp={};D.recipe.forEach(r=>{if(r.q>0)mp[r.i]=r3((mp[r.i]||0)+r.q)});
 const o={name:n,price:D.price,recipe:Object.keys(mp).map(k=>({i:k,q:mp[k]}))};
 if(D.id)Object.assign(S.products.find(p=>p.id==D.id),o);else S.products.push({id:uid(),...o});
 save();closeM();render();
}
function delProd(){if(confirm('Delete this dish? Past sales and stock movements are kept.')){S.products=S.products.filter(p=>p.id!=D.id);save();closeM();render()}}
function resetAll(){if(confirm('Reset to demo data? This clears all stock, dishes and movements.')){S=seed();save();render()}}

$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
load();render();
</script>
</body>
</html>
