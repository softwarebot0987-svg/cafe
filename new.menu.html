${TABLE?'':`<label for="oT">Table</label><select id="oT"><option>Takeaway</option>${Array.from({length:20},(_,i)=>`<option>Table ${String(i+1).padStart(2,'0')}</option>`).join('')}</select>`}
<label for="oN">Your name *</label><input id="oN" maxlength="60" autocomplete="name" value="${esc(CU.n||'')}"><label for="oP">Phone number *</label><input id="oP" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" value="${esc(CU.p||'')}"><label for="oNote">Note for the kitchen (optional)</label><textarea id="oNote" rows="2" maxlength="150" placeholder="Less spicy, no onion…"></textarea>

let CU={};try{CU=JSON.parse(localStorage.getItem('cafe_cust')||'{}')}catch(e){}

let OR=[],subs={},curT=null;try{OR=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
